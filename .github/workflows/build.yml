name: Build GBA PS2 ELF

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with make in PS2Dev container
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ps2dev/ps2dev:latest \
            sh -c '
              export PS2DEV=/usr/local/ps2dev
              export PS2SDK=$PS2DEV/ps2sdk
              export GSKIT=$PS2DEV/gsKit
              export PATH=$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PATH
              if command -v apt-get >/dev/null 2>&1; then
                apt-get update && apt-get install -y --no-install-recommends make
              elif command -v apk >/dev/null 2>&1; then
                apk add --no-cache make
              fi
              make clean || true
              make
            '

      - name: Upload GBA_PS2.ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: GBA_PS2_ELF
          path: GBA_PS2.ELF
